name: Build Signed Release

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "android/**"
      - ".github/workflows/build-release.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;34.0.0" "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore and write properties
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "ERRO: faltam secrets. Vai a Settings > Secrets and variables > Actions e cria:"
            echo "  KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD"
            exit 1
          fi

          export KEYSTORE_BASE64
          python3 - <<'PY'
          import base64
          import os
          import re
          from pathlib import Path

          raw = os.environ["KEYSTORE_BASE64"].strip()
          if raw.startswith("data:") and "," in raw:
              raw = raw.split(",", 1)[1]
          raw = raw.strip().strip('"').strip("'")
          raw = re.sub(r"\s+", "", raw)
          raw = raw.replace("-", "+").replace("_", "/")
          raw += "=" * ((4 - len(raw) % 4) % 4)

          try:
              decoded = base64.b64decode(raw, validate=True)
          except Exception as exc:
              raise SystemExit("ERRO: KEYSTORE_BASE64 não é um Base64 válido. Gere novamente o Base64 do keystore.") from exc

          if len(decoded) < 64:
              raise SystemExit("ERRO: o keystore decodificado é demasiado pequeno.")

          Path("app/dunta-taxi-release.jks").write_bytes(decoded)
          print(f"Keystore decodificado com sucesso ({len(decoded)} bytes).")
          PY

          # Detecta automaticamente JKS ou PKCS12 usando a senha fornecida.
          STORE_TYPE=""
          if keytool -list -storetype JKS -keystore app/dunta-taxi-release.jks -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            STORE_TYPE="JKS"
          elif keytool -list -storetype PKCS12 -keystore app/dunta-taxi-release.jks -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            STORE_TYPE="PKCS12"
          else
            echo "ERRO: não foi possível abrir o keystore com a KEYSTORE_PASSWORD fornecida."
            echo "O Base64 está correto, mas a senha do keystore provavelmente está incorreta ou o ficheiro não é um JKS/PKCS12 válido."
            exit 1
          fi

          echo "Tipo de keystore detectado: $STORE_TYPE"

          # Verifica alias e senha da chave sem expor os valores nos logs.
          if ! keytool -list -storetype "$STORE_TYPE" -keystore app/dunta-taxi-release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "ERRO: KEY_ALIAS não existe neste keystore (ou a KEYSTORE_PASSWORD está incorreta)."
            exit 1
          fi

          printf '%s\n' \
            "storeFile=dunta-taxi-release.jks" \
            "storeType=$STORE_TYPE" \
            "storePassword=$KEYSTORE_PASSWORD" \
            "keyAlias=$KEY_ALIAS" \
            "keyPassword=$KEY_PASSWORD" > keystore.properties
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "Keystore e alias validados com sucesso."

      - name: Create Gradle Wrapper if missing
        working-directory: android
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x ./gradlew

      - name: Build signed AAB + APK
        working-directory: android
        run: ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace

      - name: List outputs
        working-directory: android
        run: find app/build/outputs -type f \( -name "*.aab" -o -name "*.apk" \) -ls

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: dunta-taxi-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dunta-taxi-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
