name: Build Signed Release

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "android/**"
      - ".github/workflows/build-release.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;34.0.0" "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore and write properties
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "ERRO: faltam secrets (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD)"
            exit 1
          fi
          # Remover espaços/quebras de linha (comum ao colar no telemóvel)
          echo "$KEYSTORE_BASE64" | tr -d ' \n\r\t' > /tmp/ks.b64
          B64_LEN=$(wc -c < /tmp/ks.b64 | tr -d ' ')
          echo "Tamanho do base64: $B64_LEN caracteres (esperado ~3648)"
          if [ "$B64_LEN" -lt 3000 ]; then
            echo "ERRO: KEYSTORE_BASE64 está incompleto ($B64_LEN chars)."
            echo "Apaga o secret KEYSTORE_BASE64 e volta a criar com o texto COMPLETO (3648 caracteres)."
            exit 1
          fi
          base64 -d < /tmp/ks.b64 > app/dunta-taxi-release.jks
          KS_SIZE=$(wc -c < app/dunta-taxi-release.jks | tr -d ' ')
          echo "Keystore decodificado: $KS_SIZE bytes (esperado ~2736)"
          if [ "$KS_SIZE" -lt 2000 ]; then
            echo "ERRO: ficheiro JKS demasiado pequeno — base64 incompleto."
            exit 1
          fi
          # Validar password
          if ! keytool -list -keystore app/dunta-taxi-release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/tmp/kt.out 2>&1; then
            echo "ERRO: não foi possível abrir o keystore."
            cat /tmp/kt.out || true
            exit 1
          fi
          echo "Keystore OK."
          printf '%s\n' \
            "storeFile=dunta-taxi-release.jks" \
            "storePassword=$KEYSTORE_PASSWORD" \
            "keyAlias=$KEY_ALIAS" \
            "keyPassword=$KEY_PASSWORD" > keystore.properties
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Create Gradle Wrapper if missing
        working-directory: android
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x ./gradlew

      - name: Build signed AAB + APK
        working-directory: android
        run: ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace

      - name: List outputs
        working-directory: android
        run: find app/build/outputs -type f \( -name "*.aab" -o -name "*.apk" \) -ls

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: dunta-taxi-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dunta-taxi-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
