name: Build Signed Release

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "android/**"
      - ".github/workflows/build-release.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager "platforms;android-36" "platforms;android-35" "build-tools;35.0.0" "build-tools;34.0.0" "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore and write properties
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "ERRO: faltam secrets"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | tr -d ' \n\r\t' > /tmp/ks.b64
          B64_LEN=$(wc -c < /tmp/ks.b64 | tr -d ' ')
          echo "base64 chars: $B64_LEN"
          if [ "$B64_LEN" -lt 3000 ]; then
            echo "ERRO: KEYSTORE_BASE64 incompleto"
            exit 1
          fi
          base64 -d < /tmp/ks.b64 > app/dunta-taxi-release.jks
          KS_SIZE=$(wc -c < app/dunta-taxi-release.jks | tr -d ' ')
          echo "keystore bytes: $KS_SIZE"
          keytool -list -keystore app/dunta-taxi-release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS"
          printf '%s\n' \
            "storeFile=dunta-taxi-release.jks" \
            "storePassword=$KEYSTORE_PASSWORD" \
            "keyAlias=$KEY_ALIAS" \
            "keyPassword=$KEY_PASSWORD" > keystore.properties
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cat keystore.properties

      - name: Create Gradle Wrapper if missing
        working-directory: android
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x ./gradlew

      - name: Build signed AAB + APK
        working-directory: android
        run: ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace

      - name: Verify AAB is signed
        working-directory: android
        run: |
          AAB=$(ls app/build/outputs/bundle/release/*.aab | head -1)
          echo "AAB: $AAB"
          ls -la "$AAB"
          # jarsigner verification
          jarsigner -verify -verbose -certs "$AAB" 2>&1 | tail -30
          if jarsigner -verify "$AAB" 2>&1 | grep -qi "jar verified"; then
            echo "ASSINATURA OK"
          else
            echo "ERRO: AAB nao esta assinado corretamente"
            exit 1
          fi

      - name: List outputs
        working-directory: android
        run: find app/build/outputs -type f \( -name "*.aab" -o -name "*.apk" \) -ls

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: dunta-taxi-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dunta-taxi-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
