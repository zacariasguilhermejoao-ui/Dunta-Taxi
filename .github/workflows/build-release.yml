name: Build Signed Release

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "android/**"
      - ".github/workflows/build-release.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERRO: secret KEYSTORE_BASE64 em falta. Adiciona em Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > dunta-taxi-release.jks
          cat > keystore.properties << EOF
          storeFile=dunta-taxi-release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF
          # remove leading spaces from heredoc
          sed -i 's/^[[:space:]]*//' keystore.properties
          echo "sdk.dir=$ANDROID_HOME" > local.properties || true

      - name: Make gradlew executable
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x gradlew

      - name: Build signed AAB + APK
        run: |
          ./gradlew bundleRelease assembleRelease --no-daemon

      - name: List outputs
        run: |
          find app/build/outputs -type f \( -name "*.aab" -o -name "*.apk" \) -ls

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: dunta-taxi-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dunta-taxi-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
