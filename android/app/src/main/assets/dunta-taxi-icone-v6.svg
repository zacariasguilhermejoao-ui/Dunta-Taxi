<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgRed3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B2E"/>
      <stop offset="100%" stop-color="#C10F06"/>
    </linearGradient>
    <linearGradient id="yellowGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEB6B"/>
      <stop offset="100%" stop-color="#FFC400"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bgRed3)"/>

  <!-- monogram: D and T interlocked, bold geometric -->
  <g transform="translate(256,270)">
    <!-- D shape -->
    <path d="M-140 -120
             L-60 -120
             C10 -120 60 -68 60 0
             C60 68 10 120 -60 120
             L-140 120
             Z
             M-84 -68
             L-84 68
             L-60 68
             C-12 68 8 34 8 0
             C8 -34 -12 -68 -60 -68
             Z"
          fill="url(#yellowGrad3)" fill-rule="evenodd"/>

    <!-- T shape, overlapping to the right forming a single mark -->
    <path d="M40 -120 L172 -120 L172 -68 L134 -68 L134 120 L78 120 L78 -68 L40 -68 Z"
          fill="#FFFFFF"/>
  </g>

</svg>
